[project]
name = "research"
version = "0.1.0"
description = "Pipeline de datos de la plataforma (notebooks y librería compartida)"
requires-python = "==3.12.*"
dependencies = [
  "pandas==3.0.6",
  "matplotlib==3.11.2",
  "requests==2.34.2",
  "jsonschema==4.26.0",
  "jupyter==1.1.1",
  "nbclient==0.11.0",
  "nbstripout==0.9.1",
  "openpyxl==3.1.5",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
